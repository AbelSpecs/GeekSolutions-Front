<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Console</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brandCyan: "#63CFE3",
              brandBlack: "#000000",
              darkBg: "#090B0E",
              cardBg: "#12161F",
            },
            fontFamily: {
              sans: ["Montserrat", "sans-serif"],
            },
          },
        },
      };
    </script>
    <style>
      body {
        font-family: "Montserrat", sans-serif;
        background-color: #090b0e;
        color: #ffffff;
      }
      .glow-cyan {
        box-shadow: 0 0 25px rgba(99, 207, 227, 0.25);
      }
      .text-gradient {
        background: linear-gradient(135deg, #ffffff 0%, #63cfe3 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
  </head>
  <body class="antialiased selection:bg-brandCyan selection:text-black">
    <section
      id="console"
      class="pt-24 pb-20 md:pt-36 md:pb-32 px-6 relative overflow-hidden flex justify-center items-center min-h-[80vh]"
    >
      <div id="console-container" class="w-full max-w-2xl">
        <div
          id="console-body"
          class="bg-cardBg border border-white/10 rounded-2xl p-6 shadow-2xl relative font-mono w-full flex flex-col"
        >
          <div
            class="flex items-center justify-between border-b border-white/10 pb-4 mb-4 select-none"
          >
            <div class="flex items-center gap-2">
              <span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>
              <span
                class="w-3 h-3 rounded-full bg-yellow-500 inline-block"
              ></span>
              <span
                class="w-3 h-3 rounded-full bg-green-500 inline-block"
              ></span>
            </div>
            <span class="text-xs text-gray-400"
              >Geeks_Solutions_Console.sys</span
            >
          </div>

          <p
            id="console-content"
            class="w-full h-[300px] p-2 whitespace-pre-line overflow-y-auto text-sm text-gray-300 font-mono scrollbar-thin"
          >
            Bienvenido a la consola interactiva de Geek Solutions. Escribe
            'projects', 'clear' o 'version' para comenzar.
          </p>

          <div
            class="flex items-center gap-2 pt-4 border-t border-white/10 mt-2"
          >
            <span class="text-brandCyan font-bold select-none">gs &gt;</span>
            <input
              type="text"
              id="command-input"
              placeholder="Escribe un comando..."
              class="bg-transparent border-none focus:outline-none focus:ring-0 outline-none w-full text-white font-mono text-sm placeholder-gray-600 py-1"
              autofocus
            />
          </div>
        </div>
      </div>
    </section>

    <script>
      const commands = ["projects", "clear", "version"];
      const projects = {
        PyrosFit:
          "PyrosFit, una aplicación para el seguimiento de tus rutinas de ejercicio, te permite llevar un control detallado de tus rutinas diarias en el gimnasio y poder ver tus avances a lo largo del tiempo. Pensado por geeks. By Geek Solutions",
      };

      const consoleContent = document.getElementById("console-content");
      const commandInput = document.getElementById("command-input");
      const consoleBody = document.getElementById("console-body");
      const historyCommands = [];
      let index = 0;

      commandInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          const cmd = e.target.value.trim();
          if (!cmd) return;

          historyCommands.push(cmd);
          index = historyCommands.length;

          if (cmd === commands[0]) {
            consoleContent.textContent += `gs > ${cmd}\n${Object.values(projects).join("\n")}\n\n`;
          } else if (cmd === commands[1]) {
            consoleContent.textContent = "";
          } else if (cmd === commands[2]) {
            consoleContent.textContent += `gs > ${cmd}\nGeekSolutions Console v1.0.0\n`;
          } else {
            consoleContent.textContent += `gs > ${cmd}\nComando no reconocido: '${cmd}'. Escribe 'projects', 'clear' o 'version'.\n`;
          }

          commandInput.value = "";
          consoleContent.scrollTop = consoleContent.scrollHeight;
        }

        if (e.key === "ArrowUp") {
          if (historyCommands.length === 0) return;
          e.preventDefault();

          if (index > 0) {
            index--;
          }
          commandInput.value = historyCommands[index] || "";
        }

        if (e.key === "ArrowDown") {
          if (historyCommands.length === 0) return;
          e.preventDefault();

          if (index < historyCommands.length - 1) {
            index++;
            commandInput.value = historyCommands[index];
          } else {
            index = historyCommands.length;
            commandInput.value = "";
          }
        }
      });

      consoleBody.addEventListener("click", () => {
        commandInput.focus();
      });
    </script>
  </body>
</html>
